# Codex Remote gateway, containerized while sharing the HOST Codex install.
#
#   phone browser --HTTPS--> your proxy/tunnel --127.0.0.1:5173--> docker-proxy
#                                                    gateway (container) -> codex app-server
#                                                    host ~/.codex  +  workspace bind mounts
#
# The container runs the Node gateway only. Everything else lives on the host:
#   - the Codex CLI install, login, and thread/sqlite state under ~/.codex
#   - one or more workspace repositories that users may open
# Both are bind-mounted read-write into the container at the SAME absolute path
# they occupy on the host. Do NOT use a short alias like /codex or /workspace:
#   1. The Codex standalone layout stores absolute symlinks
#      (packages/standalone/current -> release dir); they only resolve when the
#      container sees ~/.codex at its host path.
#   2. CODEX_REMOTE_WORKSPACE_ROOTS must name paths that are valid both on the
#      host and in the container, so the container must see them at host paths.
#
# Configuration lives in `.env` (copy `.env.example`). It mixes two kinds:
#   - app variables passed to the Node process via env_file: the CODEX_REMOTE_* vars
#   - host-layout variables used to build the bind mounts below (interpolated by
#     compose, not read by the app):
#       CODEX_HOME_HOST              host path of ~/.codex, e.g. /home/me/.codex
#       CODEX_REMOTE_WORKSPACE_ROOT  the repo to expose, e.g. /home/me/code/proj
#
# The gateway runs as the user that OWNS those host dirs. The image's default is
# the uid-1000 `node` user; if your host user is not uid 1000 (e.g. a root-owned
# VPS), set CODEX_REMOTE_UID/CODEX_REMOTE_GID to match in `.env`.
#
# HTTPS is intentionally NOT terminated here: point your existing proxy/tunnel
# (ngrok, Caddy, Tailscale, SSH…) at 127.0.0.1:${CODEX_REMOTE_PORT:-5173} and set
# CODEX_REMOTE_PUBLIC_ORIGIN to its exact HTTPS origin. The port is published on
# the loopback interface only, as the app expects.

name: codex-remote

services:
  gateway:
    build:
      context: .
    image: codex-remote:0.1.0
    restart: unless-stopped
    init: true                      # reap the spawned codex child on shutdown
    # Run as the user that owns the mounted host trees (see header). Defaults to
    # 1000:1000 (the image's `node` user); override via CODEX_REMOTE_UID/GID.
    user: "${CODEX_REMOTE_UID:-1000}:${CODEX_REMOTE_GID:-1000}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Must listen on all interfaces so docker-proxy can reach it; local-only
      # exposure is enforced by publishing on 127.0.0.1 below.
      CODEX_REMOTE_HOST: 127.0.0.1
      # The mounted ~/.codex, at its host path (symlink caveat above).
      CODEX_HOME: ${CODEX_HOME_HOST:?set CODEX_HOME_HOST in .env (see .env.example)}
      # The container has no `codex` on PATH; point at the standalone binary
      # through the stable `current` symlink so Codex self-updates keep working.
      CODEX_REMOTE_CODEX_BIN: ${CODEX_HOME_HOST:?set CODEX_HOME_HOST in .env (see .env.example)}/packages/standalone/current/bin/codex
      # Web-push state is a plain file inside the ~/.codex *directory* mount so
      # it persists across restarts. It must not be a bind-mounted single file:
      # push.js saves via a sibling .tmp + rename(), and rename() cannot replace
      # a bind-mounted file (its path is a mountpoint -> EBUSY).
      CODEX_REMOTE_PUSH_STATE: ${CODEX_HOME_HOST:?set CODEX_HOME_HOST in .env (see .env.example)}/codex-remote-push.json
    network_mode: host
    volumes:
      # Host ~/.codex (Codex install + login + sessions), mounted at its host
      # path so the absolute symlinks under packages/standalone resolve.
      - ${CODEX_HOME_HOST:?set CODEX_HOME_HOST in .env (see .env.example)}:${CODEX_HOME_HOST:?set CODEX_HOME_HOST in .env (see .env.example)}
      # One workspace repo, mounted at its host path. Add one
      # `- /abs/path/other:/abs/path/other` line per extra entry you put in
      # CODEX_REMOTE_WORKSPACE_ROOTS.
      - ${CODEX_REMOTE_WORKSPACE_ROOT:?set CODEX_REMOTE_WORKSPACE_ROOT in .env (see .env.example)}:${CODEX_REMOTE_WORKSPACE_ROOT:?set CODEX_REMOTE_WORKSPACE_ROOT in .env (see .env.example)}

    # Optional hardening. `cap_drop: [ALL]` / `no-new-privileges` are left off
    # by default because Codex's workspace sandbox may require capabilities;
    # test before enabling:
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    #
    # Linux-only alternative that binds the gateway straight to the host
    # loopback (drop the `ports:` block above and use instead):
    # network_mode: host
