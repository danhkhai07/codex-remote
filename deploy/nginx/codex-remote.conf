# Place this map at http scope (outside server blocks).
map $http_upgrade $codex_remote_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codex.example.com;

    # Codex Remote accepts files up to 25 MB. Nginx defaults to 1 MB, so the
    # proxy limit must be explicitly larger than the application limit.
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codex_remote_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep Codex's Server-Sent Events stream live and unbuffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Configure certificates here, or let Certbot manage these directives.
}
