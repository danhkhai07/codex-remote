# NEW candidate snippet, not installed. Include inside the reviewed ADMIN server
# block only. Retain its TLS/real-IP configuration and the isolated preview vhost.
# Replace 5173 if the sealed gateway uses a different loopback port.
location = /api/secure/request {
    # 25 MiB plaintext + JWE/base64/frame overhead exceeds the legacy 26 MiB cap.
    client_max_body_size 36m;
    client_body_timeout 60s;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    # Preserve trusted-proxy filtering. The Node allowlist still applies.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
}
