# Private localhost previews. Install only AFTER configuring wildcard DNS and TLS.
# Match CODEX_REMOTE_PREVIEW_ORIGIN_TEMPLATE=https://p{port}.preview.example.com.
# This vhost sends every path to Codex Remote, which authenticates the preview
# session and proxies it to the selected 127.0.0.1 port. Do not proxy to that port
# directly in nginx: that would bypass authentication.
map $http_upgrade $codex_preview_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^p[0-9]+\.preview\.example\.com$;
    ssl_certificate /etc/letsencrypt/live/preview.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.example.com/privkey.pem;
    client_max_body_size 26m;

    # Launch URLs carry a short-lived, one-use ticket; do not log query strings.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codex_preview_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
